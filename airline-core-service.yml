server:
  port: 9193

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/airline_core_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root@root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update
    database-platform: org.hibernate.dialect.MySQLDialect

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:9200/eureka/
  instance:
    hostname: localhost
    prefer-ip-address: false