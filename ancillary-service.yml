server:
  port: 9197

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/airline_ancillary_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root@root
    driver-class-name: com.mysql.cj.jdbc.Driver

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:9200/eureka/
  instance:
    prefer-ip-address: true
