server:
  port: 9196

spring:


  datasource:
    url: jdbc:mysql://localhost:3306/airline_seat_db?useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root@root
    driver-class-name: com.mysql.cj.jdbc.Driver

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: seat-service-group

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    service-url:
      defaultZone: http://localhost:9200/eureka/
  instance:
    prefer-ip-address: true
